<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Newsletter Signup Page -->
    <!-- Created by Ripon Ali -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Newsletter Signup</title>

    <link rel="stylesheet"
          href="portfolio.css">

    <script src="script.js"></script>

</head>

<body>

<header>

    <img src="logo.png"
         class="logo"
         alt="ExploreWave Logo">

</header>
<nav class="navbar">

<a href="index.html">Home</a>
<section class="hero">
</nav>
    <h1>Newsletter Signup</h1>

</section>

<section class="content">

<form onsubmit="return validateForm()">

    <!-- First Name -->

    <label for="fname">First Name *</label>

    <input type="text"
           id="fname"
           maxlength="60"
           required>

    <!-- Last Name -->

    <label for="lname">Last Name *</label>

    <input type="text"
           id="lname"
           maxlength="60"
           required>

    <!-- Email -->

    <label for="email">Email Address *</label>

    <input type="email"
           id="email"
           maxlength="60"
           required>

    <!-- Age Group -->

    <h3>Age Group</h3>

    <div class="radio-group">

        <label>
            <input type="radio" name="age">
            15-25
        </label>

        <label>
            <input type="radio" name="age">
            26-35
        </label>

        <label>
            <input type="radio" name="age">
            36-45
        </label>

        <label>
            <input type="radio" name="age">
            46-55
        </label>

        <label>
            <input type="radio" name="age">
            55+
        </label>

    </div>

    <!-- Services -->

    <h3>Services</h3>

    <div class="checkbox-group">

        <label>
            <input type="checkbox">
            Travel Packages
        </label>

        <label>
            <input type="checkbox">
            Flight Booking
        </label>

        <label>
            <input type="checkbox">
            Hotel Booking
        </label>

        <label>
            <input type="checkbox">
            Cruise Tours
        </label>

        <label>
            <input type="checkbox">
            Adventure Tours
        </label>

    </div>

    <!-- Message -->

    <h3>Message</h3>

    <textarea cols="60"
              rows="3"
              placeholder="Write your message here...">
    </textarea>

    <br><br>

    <!-- Buttons -->

    <input type="submit"
           value="Submit"
           class="btn-submit">

    <input type="reset"
           value="Reset"
           class="btn-reset">

</form>

</section>

<footer>

    <p>
        &copy; 2026 ExploreWave Tourism
    </p>

</footer>

</body>
</html>
